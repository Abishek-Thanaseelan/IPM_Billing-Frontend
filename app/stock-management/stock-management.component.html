<div class="container-fluid">
  <div class="stock-header-card">
<div class="header-top">
  <button class="home-btn" routerLink="/dashboard">
    <i class="fa fa-home me-2"></i> Home
  </button>

  <h2 class="page-title">
    <i class="fa fa-boxes me-2"></i>
    Daily Stock Management
  </h2>
</div>
     

    <div class="row mt-4">
      <div class="col-md-4">
        <label class="form-label"> Stock Place </label>

        <select class="form-control" [(ngModel)]="stockPlace">
          <option value="">IPMEGA-1</option>
        </select>
      </div>
    </div>
  </div>

  <button class="floating-home" routerLink="/dashboard">
    <i class="fa fa-home"></i>
  </button>

  <div class="card p-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="mb-0">Add Opening Stock</h4>
      <button class="btn btn-info" (click)="navigateToStockReport()">
        <i class="fa fa-bar-chart me-1"></i> Stock Report
      </button>
    </div>

    <div class="row mt-4">
      <div class="col-md-3">
        <label>Stock Date</label>

        <input type="date" class="form-control" [(ngModel)]="stockDate" />
      </div>

      <div class="col-md-3">
        <label>Product Name</label>

        <select class="form-control" [(ngModel)]="selectedProductId" (change)="onProductSelect()">
          <option value="">Select Product</option>

          <option *ngFor="let p of activeProducts" [value]="p._id">
            {{ p.productName }} {{ p.productSize ? '- ' + p.productSize : '' }}
          </option>
        </select>
      </div>

      <div class="col-md-3">
        <label>Product Size</label>

        <input type="text" class="form-control" [(ngModel)]="productSize" readonly />
      </div>

      <div class="col-md-3">
        <label>Qty</label>

        <input type="number" class="form-control" [(ngModel)]="qty" />
      </div>
    </div>
    <div class="mt-3 text-end">
      <button class="btn btn-secondary me-2" (click)="clearForm()">
        Clear
      </button>

      <!-- INSERT BUTTON -->

      <button
        *ngIf="!isEditMode"
        class="btn btn-primary"
        (click)="insertStock()"
      >
        Insert
      </button>

      <!-- UPDATE BUTTON -->

      <button
        *ngIf="isEditMode"
        class="btn btn-warning"
        (click)="updateStock()"
      >
        Update
      </button>
    </div>

    <div class="card mt-4 p-3">
      <div class="d-flex justify-content-between mb-3">
      </div>

      <div class="table-responsive">
      <table class="table table-bordered">
        <thead class="table-primary">
          <tr>
            <th>Product Name</th>
            <th>Date</th>
            <th>Opening Stock</th>
            <th>Total Sales</th>
            <th>Current Stock</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let item of stockList">
            <td>{{ item.productName }} - {{ item.productSize }}</td>
            <td>{{ todayDate }}</td>
            <td>{{ item.openingStock }}</td>
            <td>{{ item.totalSales }}</td>
            <td [class.text-danger]="item.currentStock <= 0">
              {{ item.currentStock }}
            </td>

            <td>
              <button
                class="btn btn-primary btn-sm me-2"
                (click)="editStock(item)"
              >
                Edit
              </button>

              <button
                class="btn btn-danger btn-sm"
                (click)="deleteStock(item)"
              >
                Delete
              </button>
            </td>
          </tr>
        </tbody>
      </table>
      </div>
    </div>
  </div>
</div>
